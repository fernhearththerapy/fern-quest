function card(ep){const count=chCount(ep.id), old=oldCount(ep.id);return `<article class="chapter-card" style="--accent:${ep.accent}"><div class="art-cover"><span class="art-label">BÖLÜM ${safe(ep.number)}</span><span class="art-emoji" aria-hidden="true">${ep.emoji}</span></div><div class="chapter-body"><span class="chapter-tag">${safe(ep.tag)}</span><h3>${safe(ep.name)}</h3><p>${safe(ep.teaser)}</p><div class="chapter-footer"><span>${count?'↻ '+count+'/3 yeni son':old?'Önceki sürüm: '+old+' yol · '+ep.acts.length+' karar':safe(ep.time)+' · '+ep.acts.length+' karar'}</span><button class="card-play" type="button" data-action="start" data-id="${ep.id}" aria-label="${safe(ep.name)} oyununu başlat">${count?'Tekrar oyna ↗':'Oyna ↗'}</button></div></div></article>`;}
function renderHome(){const filtered=state.filter==='hepsi'?STORIES:STORIES.filter(e=>(FILTER_TAGS[state.filter]||[]).includes(e.id));const r=memory.session&&getEpisode(memory.session.episodeId);app.innerHTML=`<main><div class="wrap"><section class="hero"><div><span class="eyebrow"><i class="dot"></i> FERN PLAY · HİKÂYE OYUNLARI</span><h1>Bir karar.<br><em>Bin ihtimal.</em></h1><p class="lead">Grup sohbetleri, aile konuşmaları, beklenmedik olaylar… Bir hikâyeye gir, seçimler yap ve olayların nasıl değişebileceğini keşfet. Puan yok, yargılama yok. Sadece senin yolun var.</p><div class="actions"><button class="btn btn-primary" data-action="start" data-id="grup-sohbeti">İlk hikâyeyi oyna <span>↗</span></button><button class="btn btn-outline" data-action="about">Nasıl oynanır? <span>↗</span></button></div><div class="stats-strip"><span><b>07</b> Hikâye</span><span><b>35</b> Karar anı</span><span><b>0</b> Üyelik</span></div></div><div class="preview-card" aria-label="Örnek oyun görünümü"><div class="screen-top"><span class="game-pill">● Bölüm 01 / Grup Sessizliği</span><span class="screen-dots"><i></i><i></i><i></i></span></div><div class="screen-card"><div class="mini-cat">Sınıf grubu · 21.34</div><h3>Bir mesaj geldi.</h3><div class="bubble"><b>Arda</b><br>Bugünün efsane cevabı 😂</div><div class="bubble right"><b>Ece</b><br>Bunu niye paylaştın ya?</div><div class="fake-choices"><span>01 · Grupta sakin bir sınır koyarım</span><span>02 · Önce Deniz’e özelden yazarım</span><span>03 · Şimdilik durup düşünürüm</span></div></div><div class="preview-label"><span>Farklı seçenekler, farklı sonuçlar.</span><span>İlk bölüm →</span></div></div></section>${r?`<section class="info-banner"><div><strong>Yarım bıraktığın bir hikâye var: ${safe(r.name)}</strong><p>Kaldığın yer bu cihazda saklandı. İstersen devam edebilirsin.</p></div><button class="btn btn-primary" data-action="resume" data-id="${r.id}">Devam et ↗</button></section>`:''}<section class="chapter-section" id="bolumler"><div class="section-title"><div><span class="eyebrow">HİKÂYE ARŞİVİ</span><h2>Hangi dünyaya gireceksin?</h2></div><p>Hepsi kurgusal, kısa ve tekrar oynanabilir. Sonucu öğrenmek için birden fazla yolu dene.</p></div><div class="filters" role="group" aria-label="Hikâyeleri filtrele">${FILTERS.map(([k,label])=>`<button type="button" class="filter ${k===state.filter?'active':''}" data-action="filter" data-id="${k}" aria-pressed="${k===state.filter}">${safe(label)}</button>`).join('')}</div><div class="chapter-grid">${filtered.map(card).join('')}</div><p class="mini-note">Bu sürüm, önceki bölümlerin devamını ve iki yeni hikâyeyi içerir. Eski üç sahnelik tamamlanma kayıtları bu cihazda ayrı tutulur. Bu oyunlar 15–18 yaşa yönelik genel bilgilendirme ve düşünme etkinliğidir. Psikolojik değerlendirme, teşhis veya tedavi sunmaz. Dilediğin bölümü atlayabilir ya da yeniden oynayabilirsin.</p></section></div></main>`;}
function scenePanel(ep){return `<aside class="scene-panel" style="--accent:${ep.accent}"><div class="scene-art"><span aria-hidden="true">${ep.emoji}</span></div><span class="scene-sub">FERN PLAY / BÖLÜM ${ep.number}</span><h2>${safe(ep.name)}</h2><p>${safe(ep.opening)}</p><div class="scene-person">${ep.cast.map(x=>`<span>${safe(x)}</span>`).join('')}</div></aside>`;}
function chatHTML(chat){return `<div class="chat" aria-label="Hikâye mesajları">${chat.map(([name,body])=>`<div class="chat-row"><span class="avatar" aria-hidden="true">${safe(name.trim().charAt(0))}</span><div class="chat-bubble"><strong>${safe(name)}</strong><p>${safe(body)}</p></div></div>`).join('')}</div>`;}
function renderStory(){const ep=getEpisode(state.episodeId);if(!ep){goHome();return;}if(state.phase==='ending'){renderEnding(ep);return;}const act=ep.acts[state.act];const sel=state.selections[state.act];const op=act.options[sel];const prior=state.act>0?ep.acts[state.act-1].options[state.selections[state.act-1]]:null;
 const branch=prior&&act.branches?act.branches[prior.approach]:'';
 // Seçim, devam eden sahnenin mesajlaşmasını da değiştirir: yalnızca geri bildirim kartını değil.
 const sceneChat=branch?[act.chat[0],['Yeni gelişme',branch],...act.chat.slice(1)]:act.chat;
 const delayed=state.act>=2?ep.acts[state.act-2].options[state.selections[state.act-2]]:null;
 const main=state.phase==='choose'?`<p class="game-question">${safe(act.prompt)}</p><div class="choice-grid">${act.options.map((o,i)=>`<button class="choice" type="button" data-action="choice" data-index="${i}"><span class="choice-num">0${i+1}</span><span><strong>${safe(o.title)}</strong><small>${safe(o.subtitle)}</small></span></button>`).join('')}</div><p class="hint">Klavye ile oynuyorsan 1, 2 veya 3 tuşunu kullanabilirsin. Seçimlerin kişiliğini ölçmek için kullanılmaz.</p>${state.act>0?`<button class="prev-scene" data-action="back" type="button">← Önceki sahneye dön ve başka bir yol dene</button>`:''}`:`<div class="selected-message"><small>SENİN SEÇİMİN</small><p>${safe(op.reply)}</p></div><div class="outcome-panel" role="status"><span class="tag">Hikâye devam ediyor</span><h3>Ve sonra…</h3><p>${safe(op.effect)}</p></div><details class="insight-box"><summary>✦ Bir başka açıdan bak</summary><p>${safe(op.insight)}</p></details><div class="game-actions"><button class="btn btn-primary" data-action="next">${state.act===ep.acts.length-1?'Hikâyenin sonuna git ↗':'Sonraki sahne ↗'}</button><button class="btn btn-ghost" data-action="back">Bu seçimi değiştir</button></div>`;
 app.innerHTML=`<main class="wrap story-shell"><div class="story-head"><button class="text-button" data-action="home">← Hikâyelere dön</button><div class="story-meta"><span>${safe(ep.time)}</span><span aria-hidden="true">·</span><span>Karar ${state.act+1} / ${ep.acts.length}</span></div></div><div class="progress-line" role="progressbar" aria-label="Hikâye ilerlemesi" aria-valuenow="${state.act+1}" aria-valuemin="0" aria-valuemax="${ep.acts.length}">${ep.acts.map((_,i)=>`<span class="${i<=state.act?'on':''}"></span>`).join('')}</div><div class="play-layout">${scenePanel(ep)}<section class="game-paper" aria-label="Oyun sahnesi"><div class="paper-tag"><span>SAHNE 0${state.act+1} / 0${ep.acts.length}</span><small>${safe(act.place)}</small></div><h1>${safe(act.title)}</h1><p class="story-narration">${safe(act.narration)}</p>${prior?`<div class="from-last"><strong>ÖNCEKİ KARARIN HİKÂYEYİ DEĞİŞTİRDİ</strong><p>${safe(prior.effect)}</p></div>`:''}${chatHTML(sceneChat)}${delayed?`<div class="long-tail"><span>İKİ SAHNE ÖNCEKİ SEÇİMİN</span><p>${safe(delayed.title)} — bu kararın ardından olaylar yeni bir noktaya geldi. Şimdiki gelişmeyi de değerlendir.</p></div>`:''}${main}</section></div><p class="mini-note">Kurgusal hikâye · Puan veya kişilik analizi yok · İstediğin an çıkıp sonra devam edebilirsin.</p></main>`;}
function renderEnding(ep){const key=outcome(ep), ending=ep.endings[key], next=STORIES[(STORIES.findIndex(x=>x.id===ep.id)+1)%STORIES.length];app.innerHTML=`<main class="wrap ending-wrap"><div class="ending-head"><div class="ending-icon">${ep.emoji}</div><span class="eyebrow"><i class="dot"></i> HİKÂYE TAMAMLANDI</span><h1>${safe(ending.title)}</h1><p>${safe(ending.text)}</p><div class="actions" style="justify-content:center"><button class="btn btn-primary" data-action="replay" data-id="${ep.id}">Başka yolu dene ↺</button><button class="btn btn-outline" data-action="home">Tüm hikâyeler →</button></div></div><section class="ending-main"><span class="paper-tag">BU TURDA NELER OLDU?</span><h2>Seçimlerinin izi</h2><p>Burada bir puan yok. Beş karar boyunca denediğin yolun geride bıraktığı düşünme notları var.</p>${ep.acts.map((a,i)=>{const o=a.options[state.selections[i]];return `<div class="path-row"><span class="path-num">0${i+1}</span><div><strong>${safe(o.title)}</strong><p>${safe(o.insight)}</p></div></div>`}).join('')}<div class="final-response"><b>Son kararının sahnedeki yankısı</b><p>${safe(ep.acts.at(-1).options[state.selections.at(-1)].effect)}</p></div><p class="ending-closing"><b>Hatırla:</b> ${safe(ep.closing)}</p><div class="accessory" style="background:#d4dcd2"></div><h2 style="font-size:18px">Merak edersen kaynaklar</h2><p>Hikâye ve konuşmalar özgün kurgu. Aşağıdaki kaynaklar, genel tasarım yaklaşımımızı ve güvenli iletişim ilkelerini bilgilendirir; oyunun klinik olarak test edildiği anlamına gelmez.</p><div class="source-links">${ep.sourceKeys.map(k=>SOURCES[k]?`<a href="${safe(SOURCES[k].url)}" target="_blank" rel="noopener noreferrer">${safe(SOURCES[k].name)} ↗</a>`:'').join('')}</div></section><div class="next-episode"><div><b>Sıradaki hikâye: ${safe(next.name)}</b><p>${safe(next.short)}</p></div><button class="btn btn-primary" data-action="start" data-id="${next.id}">Oyna ↗</button></div><div class="game-actions" style="justify-content:center;margin-top:27px"><button class="btn btn-outline" data-action="share" data-id="${ep.id}">Hikâyeyi paylaş (cevapların olmadan) ↗</button></div></main>`;}
function renderAbout(){app.innerHTML=`<main class="wrap simple-page"><span class="eyebrow"><i class="dot"></i> FERN PLAY HAKKINDA</span><h1>Oyun oynarken düşün.</h1><p class="intro">Choice Quest, 15–18 yaş grubu için hazırlanmış özgün, seçim tabanlı bir hikâye oyunudur. İletişim, arkadaşlık, aile ve dijital yaşam hakkında farklı olasılıklar keşfetmek için tasarlandı; kendini ölçmek için değil.</p><div class="about-grid"><div class="about-tile"><h2>🎮 Nasıl oynanır?</h2><p>Bir hikâye seç, beş karar anında farklı seçenekleri dene. Her seçimden sonra olayların nasıl değişebileceğini görürsün. İstersen aynı hikâyeyi yeniden oynayabilirsin.</p></div><div class="about-tile"><h2>🫶 Bir tek doğru yok</h2><p>Gerçek durumların tek çözümü olmayabilir. Seçimler bir kişilik testi veya psikolojik değerlendirme değildir. Ciddi güvenlik risklerinde güvendiğin yetişkinlerden yardım almak önemlidir.</p></div><div class="about-tile"><h2>🔒 Gizlilik</h2><p>Üyelik ve isim istemiyoruz. Seçtiğin kurgusal seçenekler ve tamamlanan bölümler yalnızca kullandığın tarayıcıda saklanabilir. Sunucuya gönderilmez. Ortak cihazlarda başkaları görebilir.</p></div><div class="about-tile"><h2>📚 Kaynak yaklaşımı</h2><p>UNICEF, NHS ve StopBullying.gov gibi kurumların genel ilkelerinden yararlanıldı. Hikâyeler özgün kurgudur; oyun klinik olarak doğrulanmış bir müdahale değildir.</p></div></div><div class="settings"><h2 style="margin-top:0">Bu cihazdaki oyun verileri</h2><p>Yalnızca oyun ilerlemesi, keşfedilen kurgu sonuçları ve varsa önceki sürümün kayıtları saklanır. İstediğin zaman sıfırlayabilirsin. Silme işlemi geri alınamaz.</p><button class="btn btn-outline" data-action="clear">İlerlemeyi sıfırla</button></div><div class="settings"><h2 style="margin-top:0">Kaynaklar</h2><div class="source-links">${Object.values(SOURCES).map(o=>`<a href="${safe(o.url)}" target="_blank" rel="noopener noreferrer">${safe(o.name)} ↗</a>`).join('')}</div><p>Fern & Hearth gönüllü, ücretsiz bir bilgilendirme platformudur; bu oyun üzerinden psikolojik danışmanlık, kişiye özel değerlendirme, tanı veya tedavi sunulmaz.</p></div><div class="game-actions"><button class="btn btn-primary" data-action="home">Hikâyelere dön →</button></div></main>`;}
function render(){document.title='Choice Quest — Seçim Senin | Fern Play';if(state.screen==='home')renderHome();else if(state.screen==='story')renderStory();else renderAbout();document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('active',e.getAttribute('data-nav')===state.screen));}
function shareStory(ep){const url=location.protocol==='file:'?'':location.origin+location.pathname+'#bolum='+ep.id;const msg=`🎮 Choice Quest — ${ep.name}\n${ep.teaser}\nFern & Hearth tarafından hazırlanmış ücretsiz, kurgusal seçim oyunu.\n${url}`.trim();window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer');}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case 'start':start(b.dataset.id);break;case 'resume':start(b.dataset.id,true);break;case 'home':goHome();break;case 'filter':state.filter=b.dataset.id;render();break;case 'choice':choose(Number(b.dataset.index));break;case 'next':next();break;case 'back':rewind();break;case 'replay':start(b.dataset.id);break;case 'about':state.screen='about';persist();setHash('');render();scrollTop();break;case 'share':{const ep=getEpisode(b.dataset.id);if(ep)shareStory(ep);break;}case 'clear':if(window.confirm('Bu cihazdaki Choice Quest oyun ilerlemesini silmek istiyor musun?')){memory={schema:2,completed:{},legacyCompleted:{},session:null};save();goHome();}break;}});
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(!n)return;e.preventDefault();if(n.dataset.nav==='home')goHome();else{state.screen='about';persist();setHash('');render();scrollTop();}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable]'))return;if(state.screen!=='story')return;if(state.phase==='choose'&&['1','2','3'].includes(e.key)){e.preventDefault();choose(Number(e.key)-1);}else if(e.key==='Enter'&&state.phase==='impact'&&document.activeElement===document.body){next();}});
window.addEventListener('hashchange',()=>{const id=hashToId();if(id&&getEpisode(id)&&state.episodeId!==id)start(id);});
(function boot(){save();const id=hashToId();if(id&&getEpisode(id))start(id);else render();})();

</script>
</body></html>
